<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>নতুন অ্যাকাউন্ট — ব্র্যাক ভয়েস সহকারী</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/admin.css" />
<script>
  (function () {
    var t = localStorage.getItem('brac-theme') === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body class="login-body">

<form class="login-card" id="registerForm" autocomplete="off">
  <div class="login-mark">
    <span class="mark-dot" aria-hidden="true"></span>
    <span>ব্র্যাক ভয়েস সহকারী</span>
  </div>
  <p class="login-sub">নতুন অ্যাকাউন্ট তৈরি করুন</p>

  <label class="field">
    <span>ইউজারনেম</span>
    <input type="text" id="username" name="username" required autocomplete="username" minlength="3" maxlength="32" />
  </label>

  <label class="field">
    <span>পাসওয়ার্ড</span>
    <input type="password" id="password" name="password" required autocomplete="new-password" minlength="6" />
  </label>

  <label class="field">
    <span>পাসওয়ার্ড আবার লিখুন</span>
    <input type="password" id="confirm" name="confirm" required autocomplete="new-password" minlength="6" />
  </label>

  <div class="login-error" id="registerError"></div>

  <button type="submit" class="login-btn" id="registerBtn">অ্যাকাউন্ট তৈরি করুন</button>

  <a class="back-link" href="/login">← আগে থেকে অ্যাকাউন্ট আছে? লগইন করুন</a>
</form>

<script>
const form = document.getElementById('registerForm');
const errorBox = document.getElementById('registerError');
const btn = document.getElementById('registerBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.textContent = '';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;

  if (password !== confirm) {
    errorBox.textContent = 'পাসওয়ার্ড দুটি মিলছে না';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'তৈরি করা হচ্ছে…';

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'অ্যাকাউন্ট তৈরি করা যায়নি');
    window.location.replace('/');
  } catch (err) {
    errorBox.textContent = err.message;
    btn.disabled = false;
    btn.textContent = 'অ্যাকাউন্ট তৈরি করুন';
  }
});
</script>

</body>
</html>
