<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#100309" />
<title>ব্র্যাক ভয়েস সহকারী</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/styles.css" />
<script>
  // Apply the saved theme before first paint (app.js loads at the end of
  // the page, which is too late and flashes the dark theme first).
  (function () {
    var t = localStorage.getItem('brac-theme') === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="masthead">
  <div class="mark">
    <span class="mark-dot" aria-hidden="true"></span>
    <span class="mark-text">ব্র্যাক ভয়েস সহকারী</span>
  </div>

  <div class="head-controls">
    <div class="kb-strip" id="kbStrip" title="নলেজ বেস">
      <span class="kb-value" id="kbValue">লোড হচ্ছে…</span>
    </div>

    <button class="theme-toggle" id="themeToggle" type="button" aria-label="থিম পরিবর্তন করুন" title="ডার্ক / লাইট">
      <svg class="theme-icon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" fill="currentColor"/>
        <path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="theme-track"><span class="theme-thumb"></span></span>
      <svg class="theme-icon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
        <path d="M20 14.2A8 8 0 0 1 9.8 4a8 8 0 1 0 10.2 10.2Z" fill="currentColor"/>
      </svg>
    </button>

    <a class="settings-btn" href="/admin" aria-label="সেটিংস" title="সেটিংস">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M19.4 13.5c.04-.33.06-.66.06-1s-.02-.67-.06-1l1.9-1.5a.6.6 0 0 0 .14-.77l-1.8-3.1a.6.6 0 0 0-.73-.26l-2.24.9a7.6 7.6 0 0 0-1.73-1l-.34-2.38a.6.6 0 0 0-.6-.51h-3.6a.6.6 0 0 0-.6.51l-.34 2.38c-.63.24-1.21.58-1.73 1l-2.24-.9a.6.6 0 0 0-.73.26l-1.8 3.1a.6.6 0 0 0 .14.77l1.9 1.5c-.04.33-.06.66-.06 1s.02.67.06 1l-1.9 1.5a.6.6 0 0 0-.14.77l1.8 3.1c.15.26.46.36.73.26l2.24-.9c.52.42 1.1.76 1.73 1l.34 2.38c.05.3.3.51.6.51h3.6c.3 0 .55-.21.6-.51l.34-2.38c.63-.24 1.21-.58 1.73-1l2.24.9c.27.1.58 0 .73-.26l1.8-3.1a.6.6 0 0 0-.14-.77l-1.9-1.5Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
    </a>

    <button class="settings-btn" id="logoutBtn" type="button" aria-label="লগআউট" title="লগআউট">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 17l5-5-5-5M21 12H9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>

<main class="stage">

  <section class="orb-wrap">
    <canvas id="orb" width="720" height="720" aria-hidden="true"></canvas>
    <p class="state-line" id="stateLine" role="status" aria-live="polite">শুরু করতে বোতামে চাপ দিন</p>
  </section>

  <button id="toggle" class="talk" type="button" aria-pressed="false">
    <span class="talk-face">
      <svg class="talk-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path class="ico-mic" d="M12 3.5a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0v-5a3 3 0 0 1 3-3Z"/>
        <path class="ico-mic" d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>
        <rect class="ico-stop" x="7.5" y="7.5" width="9" height="9" rx="2.2"/>
      </svg>
      <span class="talk-text" id="toggleText">কথা বলুন</span>
    </span>
  </button>

  <label class="guard">
    <input type="checkbox" id="echoGuard" checked />
    <span class="guard-box" aria-hidden="true"></span>
    <span>সহকারী বলার সময় মাইক বন্ধ রাখুন</span>
  </label>

  <form class="text-row" id="textForm" autocomplete="off">
    <input type="text" id="textInput" class="text-input" placeholder="অথবা এখানে লিখে পাঠান…" autocomplete="off" />
    <button type="submit" class="text-send" id="textSendBtn" aria-label="পাঠান">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M4 12L20 4l-6 8 6 8L4 12Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </button>
  </form>

</main>

<!-- Mobile: bar showing the latest turn, tap to open the full conversation -->
<button class="feed-peek" id="feedPeek" type="button" aria-expanded="false">
  <span class="feed-peek-head">
    <span class="feed-peek-who" id="peekWho">কথোপকথন</span>
    <span class="feed-peek-open">
      সব দেখুন
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </span>
  <span class="feed-peek-text" id="peekText">মাইক চালু করে বাংলায় প্রশ্ন করুন</span>
</button>

<aside class="panel" id="panel">
  <div class="panel-head">
    <span>কথোপকথন</span>
    <div class="panel-head-actions">
      <button class="clear" id="clearLog" type="button">মুছুন</button>
      <button class="panel-close" id="panelClose" type="button" aria-label="বন্ধ করুন">✕</button>
    </div>
  </div>
  <div class="log" id="log">
    <p class="empty">মাইক চালু করে বাংলায় প্রশ্ন করুন। উত্তর শুধু আপনার দেওয়া নথি থেকে আসবে।</p>
  </div>
</aside>
<div class="panel-scrim" id="panelScrim"></div>

<script src="/static/app.js"></script>
</body>
</html>
